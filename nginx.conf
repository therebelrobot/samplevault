server {
    listen 80;
    server_name _;

    # Everything is served under /samples/ inside the container too, so an NPM
    # custom location for /samples/ proxies straight through with no rewrite.

    types {
        audio/wav        wav;
        audio/mpeg       mp3;
        audio/ogg        ogg;
        audio/flac       flac;
        audio/mp4        m4a;
        text/html        html;
        application/json json;
    }

    # Longest-prefix wins, so these two beat the general /samples/ block below.
    location /samples/ui/ {
        alias /srv/ui/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Remote sample proxy. Kept as its own location so audio gets buffered and a
    # long timeout, unlike the JSON API.
    location /samples/remote/ {
        proxy_pass http://samplevault-api:3012/api/remote/;
        proxy_set_header Host $host;
        proxy_buffering on;
        proxy_read_timeout 60s;
    }

    location /samples/api/ {
        proxy_pass http://samplevault-api:3012/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Manifests are rendered by the API on every request — there is no file.
    location = /samples/strudel.json {
        proxy_pass http://samplevault-api:3012/api/manifest;
        proxy_set_header Host $host;
    }

    # Named views: /samples/m/live-set.json
    location /samples/m/ {
        proxy_pass http://samplevault-api:3012/api/manifest/;
        proxy_set_header Host $host;
    }

    location /samples/ {
        alias /srv/samples/;
        autoindex off;
        # One hour, not a year: replacing a take under the same filename would
        # otherwise serve stale audio until the browser cache is cleared.
        add_header Cache-Control "public, max-age=3600" always;

        # Only needed if samples ever live on a DIFFERENT origin than the
        # Strudel UI. Same-origin needs no CORS at all.
        # add_header Access-Control-Allow-Origin "https://strudel.example.com" always;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
